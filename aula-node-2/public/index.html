<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Controle de Contas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    input, button {
      padding: 8px;
      font-size: 16px;
    }
    h2 {
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <h1>Controle de Contas</h1>

  <h2>Conta a Receber</h2>
  <form action="/receber" method="get">
    <label>Informe o valor a receber:</label><br><br>
    <input type="number" step="0.01" min="0.01" name="valor" required>
    <br><br>
    <button type="submit">Adicionar Recebimento</button>
  </form>

  <h2>Conta a Pagar</h2>
  <form action="/pagar" method="get">
    <label>Informe o valor a pagar:</label><br><br>
    <input type="number" step="0.01" min="0.01" name="valor" required>
    <br><br>
    <button type="submit">Adicionar Pagamento</button>
  </form>

</body>
</html>
